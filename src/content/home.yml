government:
  eyebrow: Division one · Our primary focus
  title: Government & military installation support
  lead: "Installation requirements rarely arrive as a single item. A typical RFQ mixes maintenance stock, electrical parts, safety equipment and one or two things that are hard to find, all due at a gate with its own access and receiving rules. We are set up for exactly that kind of request: one quotation covering every line, sourced against the stated specification, with the documentation your file needs."
  image: ""
  image_alt: ""
  image_note: "PHOTO: equipment being inspected against a packing list at a loading bay"
  steps_title: How an RFQ moves through Exron Global
  steps:
    - title: Acknowledge
      text: Every RFQ is logged, given a reference number and acknowledged. We confirm the response deadline, delivery destination and any requirements we need to clarify.
    - title: Identify suppliers
      text: We go to manufacturers and authorized distributors that can supply the exact item, brand or equivalent the specification allows.
    - title: Check compliance
      text: Each line is checked against the technical specification. Where we propose an equal to a named brand, we say so clearly and attach the data sheet.
    - title: Price and propose
      text: You receive an itemized quotation with unit prices, lead times and validity period, prepared in the format the solicitation asks for.
    - title: Execute the order
      text: When a purchase order or award arrives, we place supplier orders, confirm production and dispatch dates, and track each one.
    - title: Coordinate freight and customs
      text: We coordinate freight forwarding, shipping documents and customs clearance with our logistics partners.
    - title: Deliver and document
      text: Deliveries are scheduled to the installation's receiving requirements, with packing lists, invoices and proof of delivery.
    - title: Follow through
      text: After delivery we handle discrepancies, replacements and warranty questions, and remain your single point of contact.
  link_label: "For contracting officers: company and vendor information"

capabilities:
  title: What we supply
  intro: We quote mixed requirements across these categories in a single response.
  items:
    - name: General supplies and commodities
      examples: Consumables, janitorial and cleaning supplies, packaging, operational stock
    - name: Industrial equipment, tools and machinery
      examples: Power and hand tools, workshop equipment, compressors, material handling
    - name: Electrical, mechanical and maintenance supplies
      examples: Cable, breakers, lighting, bearings, fasteners, lubricants
    - name: Building materials and facility maintenance
      examples: Cement, steel, paint, doors, fixtures, repair materials
    - name: HVAC, plumbing and infrastructure equipment
      examples: Split and package AC units, pumps, pipe and fittings, water tanks
    - name: IT hardware, networking and office technology
      examples: Laptops, servers, switches, structured cabling, printers
    - name: Safety equipment and PPE
      examples: Helmets, gloves, eyewear, high-visibility clothing, fire extinguishers, first aid
    - name: Office furniture, equipment and operational supplies
      examples: Desks, seating, storage, lodging furniture
    - name: Specialized equipment sourcing
      examples: Hard-to-find, low-volume or brand-specific items
    - name: Logistics and delivery support
      examples: Freight forwarding coordination, customs clearance coordination, final delivery
  footnote: We also quote other authorized procurement requirements within our operational capabilities. If an item is not listed, send the specification.
  link_label: View full capabilities

