why:
  title: Why contracting officers and buyers work with us
  items:
    - claim: Experienced management.
      detail: Our managers have quoted, sourced and delivered against installation requirements before.
    - claim: We know how government RFQs work.
      detail: We read the whole solicitation, including specifications, delivery terms, required forms and deadlines, and quote to it.
    - claim: International sourcing.
      detail: "We source from manufacturers and distributors in [CONFIRM: source regions or countries] and coordinate them on your behalf."
    - claim: One quotation across many categories.
      detail: Mixed RFQs are quoted together rather than split across several vendors.
    - claim: Clear RFQ communication.
      detail: Every request gets a reference number, an acknowledgment and a named contact.
    - claim: Logistics included.
      detail: Freight, customs and delivery coordination are part of the order, not an add-on.
    - claim: Quality-focused supplier selection.
      detail: We prefer manufacturers and authorized distributors, and we document what we supply.
    - claim: Competitive sourcing.
      detail: We compare sources for each line and look at freight and duty as well as unit price.
    - claim: Accuracy and accountability.
      detail: Our quotation matches the specification, or we tell you exactly where it does not.
    - claim: A wider business network.
      detail: Our affiliated companies add market knowledge and commercial support (see below).

